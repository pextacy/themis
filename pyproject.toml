[project]
name = "themis"
version = "0.1.0"
description = "Evidence, not opinions, for every contribution."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
themis = "themis.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-defusedxml>=0.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/themis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["live: calls hosted Otari; needs OTARI_API_KEY and costs money"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts/spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
